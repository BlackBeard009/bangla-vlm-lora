# BAN-Cap full-data run — bridged GiT + LoRA on the full BAN-Cap corpus.
#
# 7,282 train / 809 val (90/10 seed-42 split on 8,091 Flickr8k images;
# 5 native Bengali captions each from 5 different annotators). 5,000
# LoRA steps, batch 4. Target wall-clock ~35-40 min on a T4. Mirrors
# configs/banglalekha_full.yaml so the two runs are directly comparable.

model:
  name: microsoft/git-base
  dtype: float32
  use_fast_tokenizer: false

bridge:
  donor_tokenizer: csebuetnlp/banglabert
  donor_model_for_init: csebuetnlp/banglabert
  init_strategy: donor

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query, key, value]
  modules_to_save: [output, word_embeddings]

data:
  loader: bancap
  captions_path: /content/drive/MyDrive/bangla-vlm-lora/data/raw/bancap/BAN-Cap_captiondata.csv
  images_dir: /content/bancap_dl/Images
  val_fraction: 0.1
  max_samples: null
  max_val_samples: null
  caption_selection: random   # all 5 annotator captions, sampled uniformly per __getitem__

training:
  steps: 5000
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 50
  eval_every: 500

generation:
  max_new_tokens: 30
  num_beams: 4
  n_samples: 8

seed: 42

output:
  results_subdir: bancap_full
  save_adapter: true
