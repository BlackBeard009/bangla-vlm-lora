# BanglaLekha full-data run — bridged GiT + LoRA, LOCAL retrain.
#
# Identical recipe + seed to configs/banglalekha_full.yaml (the Colab
# run); only the data paths change to the local-workstation layout.
# Retrained 2026-07-18 because the original adapter lives only on
# Google Drive, which is not mounted on this machine. Needed as the
# "our honest model" row of the metric-validity triplet under the
# published 2-ref BanglaLekha protocol.

model:
  name: microsoft/git-base
  dtype: float32
  use_fast_tokenizer: false

bridge:
  donor_tokenizer: csebuetnlp/banglabert
  donor_model_for_init: csebuetnlp/banglabert
  init_strategy: donor

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query, key, value]
  modules_to_save: [output, word_embeddings]

data:
  captions_path: data/raw/banglalekha/captions.json
  images_dir: D:\bangla-vlm-lora\banglalekha_dl\images
  val_fraction: 0.1
  max_samples: null
  max_val_samples: null
  caption_selection: random

training:
  steps: 5000
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 50
  eval_every: 500

generation:
  max_new_tokens: 30
  num_beams: 4
  n_samples: 8

seed: 42

output:
  results_subdir: banglalekha_full
  save_adapter: true
