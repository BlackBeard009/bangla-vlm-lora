# BAN-Cap 10K-step run with image-tower LoRA.
#
# Identical to configs/bancap_full_10k.yaml except the LoRA placement:
# adds the CLIP-ViT attention projections (q_proj/k_proj/v_proj/out_proj —
# the text-only recipe's [query, key, value] silently misses them) and
# fully unfreezes the vision->text Linear (visual_projection.
# visual_projection.0). Delta vs text-only: +96 vision LoRA tensors
# (~590K params) + 592K projection params. Wiring verified 2026-07-05
# (12x4x2 vision + 6x3x2 text LoRA tensors, projection Linear trainable).
#
# Hypothesis: helps most on fine-grained visual content (colors, counts,
# spatial relations); expected to move content-word metrics (BLEU-1,
# CIDEr) rather than composition (BLEU-3/4).

model:
  name: microsoft/git-base
  dtype: float32
  use_fast_tokenizer: false

bridge:
  donor_tokenizer: csebuetnlp/banglabert
  donor_model_for_init: csebuetnlp/banglabert
  init_strategy: donor

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query, key, value, q_proj, k_proj, v_proj, out_proj]
  modules_to_save: [output, word_embeddings, visual_projection.visual_projection.0]

data:
  loader: bancap
  captions_path: data/raw/bancap/BAN-Cap_captiondata.csv
  images_dir: data/raw/flickr8k/Images
  val_fraction: 0.1
  max_samples: null
  max_val_samples: null
  caption_selection: random

training:
  steps: 10000
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 50
  eval_every: 500

generation:
  max_new_tokens: 30
  num_beams: 4
  n_samples: 8

seed: 42

output:
  results_subdir: bancap_img_lora_10k
  save_adapter: true
