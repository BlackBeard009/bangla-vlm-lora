# Bornon reproduction — published BanglaLekha recipe (arXiv:2109.05218).
#
# Best published BanglaLekha row (Table 2): transformer, 3 layers,
# 1 head, InceptionV3 features, 50 epochs, batch 64, Adam + Vaswani
# schedule (warmup 4000), top-5000 Keras tokenizer, 7154/1000/1000
# split, corpus BLEU on 2 refs. Published: B1 0.665 / B2 0.556 /
# B3 0.476 / B4 0.408.
#
# Unstated in the paper, set to Vaswani/TF-tutorial defaults here
# for the metric-validity reproduction:
# d_model 512, dff 2048, dropout 0.1, greedy decode, startseq/endseq
# sentinels, sinusoidal positions on text only.

seed: 42

data:
  captions_path: data/raw/banglalekha/captions.json
  images_dir: D:\bangla-vlm-lora\banglalekha_dl\images

tokenizer:
  num_words: 5000

model:
  num_layers: 3
  num_heads: 1
  d_model: 512
  dff: 2048
  dropout: 0.1

training:
  epochs: 50
  batch_size: 64
  warmup: 4000

metrics:
  bertscore: true
  bertscore_batch_size: 64

output:
  results_subdir: bornon_repro
  save_model: true
