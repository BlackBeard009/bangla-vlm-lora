# BAN-Cap 10K-step run — same recipe as bancap_full, doubled budget.
#
# Motivation: the 5K run's validation curve was
# still descending at step 5,000 (Δ -0.038 over the last 500 steps).
# Nothing else changes vs. configs/bancap_full.yaml, so the two runs are
# directly comparable and the delta is attributable to training budget.
#
# Relative data paths resolve against the CWD — run from the repo root
# (local workstation layout; on Colab use the /content/... paths).

model:
  name: microsoft/git-base
  dtype: float32
  use_fast_tokenizer: false

bridge:
  donor_tokenizer: csebuetnlp/banglabert
  donor_model_for_init: csebuetnlp/banglabert
  init_strategy: donor

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query, key, value]
  modules_to_save: [output, word_embeddings]

data:
  loader: bancap
  captions_path: data/raw/bancap/BAN-Cap_captiondata.csv
  images_dir: data/raw/flickr8k/Images
  val_fraction: 0.1
  max_samples: null
  max_val_samples: null
  caption_selection: random

training:
  steps: 10000
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 50
  eval_every: 500

generation:
  max_new_tokens: 30
  num_beams: 4
  n_samples: 8

seed: 42

output:
  results_subdir: bancap_full_10k
  save_adapter: true
