# BanglaLekha full-data run — bridged GiT + LoRA.
#
# Full 9,154-image BanglaLekha-Image-Captions corpus (8,239 train /
# 915 val at val_fraction=0.1, seed 42). 5000 LoRA steps, batch 4.
# Target wall-clock ~35-40 min on a T4. Companion to the slice
# (configs/banglalekha_slice.yaml).

model:
  name: microsoft/git-base
  dtype: float32
  use_fast_tokenizer: false

bridge:
  donor_tokenizer: csebuetnlp/banglabert
  donor_model_for_init: csebuetnlp/banglabert
  init_strategy: donor

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [query, key, value]
  modules_to_save: [output, word_embeddings]

data:
  captions_path: /content/drive/MyDrive/bangla-vlm-lora/data/raw/banglalekha/captions.json
  images_dir: /content/banglalekha_raw/images
  val_fraction: 0.1
  max_samples: null
  max_val_samples: null
  caption_selection: random

training:
  steps: 5000
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.0
  log_every: 50
  eval_every: 500

generation:
  max_new_tokens: 30
  num_beams: 4
  n_samples: 8

seed: 42

output:
  results_subdir: banglalekha_full
  save_adapter: true
